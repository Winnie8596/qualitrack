# Local development services. Credentials come from .env (copy .env.example to .env).
name: qualitrack

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # ":?" makes compose fail fast with a clear message if .env is missing a value
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to localhost only so the database is not reachable from the network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The dashboard's cache (plan.md S6). Nothing is lost if it goes away: the API counts from the database instead.
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Bound to localhost only, like the database
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
