# The whole app on one machine: `docker compose up` builds the image and serves https://localhost:8443.
# For development against `dotnet run` and the Vite dev server, start only what they need:
#   docker compose up -d db cache
# Credentials come from .env (copy .env.example to .env).
name: qualitrack

services:
  # The API and the built web app in one container (see Dockerfile). Not published to the host: its session
  # cookie needs HTTPS, so the only way in is the proxy below.
  app:
    build: .
    image: qualitrack:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      telemetry:
        condition: service_started
    environment:
      # Inside the compose network the database is "db" on its own port, whatever POSTGRES_PORT maps it to outside
      ConnectionStrings__QualiTrack: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: cache:6379
      # A demo: bring the database up to date and fill it on start. A real deployment leaves both off.
      Database__MigrateOnStartup: "true"
      DemoData__Seed: "true"
      DemoUsers__Inspector: ${DemoUsers__Inspector:?set DemoUsers__Inspector in .env}
      DemoUsers__Investigator: ${DemoUsers__Investigator:?set DemoUsers__Investigator in .env}
      DemoUsers__QaManager: ${DemoUsers__QaManager:?set DemoUsers__QaManager in .env}
      # Traces, metrics and logs go to the viewer below over OTLP
      OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:18889
    volumes:
      # Photos and the session cookie's keys outlive the container
      - app-data:/data

  # Ends TLS in front of the app, as the ingress does in production (see deploy/Caddyfile)
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # Bound to localhost only, like the database
      - "127.0.0.1:${APP_PORT:-8443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy's local certificate authority, kept so the certificate stays the same between runs
      - proxy-data:/data

  # Where the app's telemetry can be looked at locally: the Aspire Dashboard, a standalone OpenTelemetry viewer.
  # Open http://localhost:18888 for traces (each request and its SQL), metrics (request duration) and logs.
  # It keeps everything in memory and forgets it on restart. Production would send the same OTLP to a real backend.
  telemetry:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5
    restart: unless-stopped
    environment:
      # No login token: it is bound to localhost and holds only this demo's telemetry
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:${TELEMETRY_PORT:-18888}:18888"
      # OTLP over gRPC, for an API started with `dotnet run` (see .env.example)
      - "127.0.0.1:4317:18889"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # ":?" makes compose fail fast with a clear message if .env is missing a value
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to localhost only so the database is not reachable from the network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The dashboard's cache (plan.md S6). Nothing is lost if it goes away: the API counts from the database instead.
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Bound to localhost only, like the database
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  app-data:
  proxy-data:
