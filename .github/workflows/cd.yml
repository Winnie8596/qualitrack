name: CD

# A release is a tag: `git tag v1.2.3 && git push origin v1.2.3`. The tag's image is built once, pushed to
# GitHub Container Registry and rolled out to Azure Container Apps (created by infra/provision.sh).
on:
  push:
    tags: ["v*"]

# One rollout at a time; a second tag waits for the first rather than racing it
concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      # Registry paths are lower case; the repository's owner may not be
      - name: Name the image
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # The workflow's own short-lived token; no stored registry password
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build
        run: >-
          docker build
          --tag "${{ steps.name.outputs.image }}"
          --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
          --label "org.opencontainers.image.revision=${{ github.sha }}"
          .

      - name: Push
        run: docker push "${{ steps.name.outputs.image }}"

  deploy:
    needs: image
    runs-on: ubuntu-latest
    # Skipped until the repository has been connected to Azure (infra/README.md, "Let GitHub deploy")
    if: vars.AZURE_CLIENT_ID != ''
    environment: production
    permissions:
      contents: read
      # Lets the job ask GitHub for an identity token, which Azure accepts in place of a stored secret (OIDC)
      id-token: write
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # A new revision with the new image; Container Apps moves traffic to it once it answers its probes
      - name: Roll out the image
        run: >-
          az containerapp update
          --name "${{ vars.AZURE_CONTAINER_APP }}"
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --image "${{ needs.image.outputs.image }}"

      - name: Check the new version answers
        run: |
          host=$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn --output tsv)
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "https://${host}/health"
